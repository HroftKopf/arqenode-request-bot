[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "backups"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["."]
omit = [".venv/*", "tests/*", "backups/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
